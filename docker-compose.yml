version: "3.8"

services:
  ahd-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      AppSettings__ApiKey: ${API_KEY:-change-this-secret-key}
      AppSettings__AusGeoidGtxUrl: ${AUS_GEOID_URL:-}
      AppSettings__SnowRegionXlsxUrl: ${SNOW_REGION_URL:-}
      AppSettings__WindRegionZipUrl: ${WIND_REGION_URL:-}
    volumes:
      - ./Data:/app/Data
    restart: unless-stopped
